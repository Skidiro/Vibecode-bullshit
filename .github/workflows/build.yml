name: Compilar
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: unzip -q maos-vr.zip && cd maos-vr && gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: maos-vr-mod
          path: maos-vr/build/libs/maos-vr-*[0-9].jar
